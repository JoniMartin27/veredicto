name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test

  # Veredicto dogfoods itself: it runs on its own PRs.
  veredicto:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          mode: warn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Veredicto is paid software and refuses to run without a licence key.
          # This repository IS Veredicto, so it uses the development bypass rather
          # than a key it would have to issue to itself. Customers use a key; see
          # docs/GETTING-STARTED.md.
          VEREDICTO_DEV: '1'
